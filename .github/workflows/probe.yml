name: probe frontends
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe search engines
        run: |
          for u in \
            "https://lite.duckduckgo.com/lite/?q=shabbat" \
            "https://html.duckduckgo.com/html/?q=shabbat" \
            "https://www.bing.com/search?q=shabbat" \
            "https://search.brave.com/search?q=shabbat" \
            "https://www.mojeek.com/search?q=shabbat" \
            "https://www.startpage.com/do/search?q=shabbat" \
            "https://yandex.com/search/?text=shabbat" \
            "https://www.ecosia.org/search?q=shabbat" \
            "https://searx.be/search?q=shabbat" \
            "https://www.google.com/search?q=shabbat&gbv=1" \
            "https://he.wikipedia.org/w/index.php?search=shabbat" ; do
            c=$(curl -sL -m 20 -o /tmp/s.html -w '%{http_code} size=%{size_download} final=%{url_effective}' -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120' "$u" || true)
            t=$(grep -oiE '<title>[^<]{0,60}' /tmp/s.html | head -1 || true)
            r=$(grep -ciE 'captcha|unusual traffic|are you a human|robot|anomaly' /tmp/s.html || true)
            echo "RES $u => $c bot=$r $t"
          done
