name: probe frontends
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe kore
        run: |
          for h in www.kore.co.il kore.co.il; do
            curl -s -m 15 -o /dev/null -D - "http://$h/" | head -8 | sed "s/^/RES $h hdr: /" || true
            c=$(curl -sL -m 15 -o /tmp/s.html -w '%{http_code} size=%{size_download} final=%{url_effective}' -A 'Mozilla/5.0' "http://$h/" || true)
            he=$(grep -oP '[א-ת]{3,}' /tmp/s.html | wc -l || true)
            js=$(grep -ci '<script' /tmp/s.html || true)
            t=$(grep -oiE '<title>[^<]{0,80}' /tmp/s.html | head -1 || true)
            echo "RES $h => $c hebrew=$he scripts=$js $t"
          done
